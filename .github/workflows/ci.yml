name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tally/web exec playwright install --with-deps chromium
      - name: Build (standalone)
        run: pnpm build
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
      - name: Playwright at 375/768/1280, region gate, reduced motion, keyboard
        run: pnpm e2e
        env:
          CI: "1"
          TALLY_ALLOW_MISSING_GEO: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: apps/web/test-results/*.png
          if-no-files-found: ignore

  # Offline Foundry suites arrive in M2 (contracts/ is empty until then).
