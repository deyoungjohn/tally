name: Fork tests (on demand)

# ShareGuard fork tests A-I replay real Trading API calldata on a BSC mainnet fork. They need an
# ARCHIVE-capable BSC RPC (the fork is pinned to each capture's block). Add it as the repository
# secret BSC_RPC, then run this workflow from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      captures:
        description: "Space-separated capture names in contracts/captures (empty = all)"
        required: false
        default: ""

jobs:
  fork:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      BSC_RPC: ${{ secrets.BSC_RPC }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: ./script/fork.sh ${{ inputs.captures }}
